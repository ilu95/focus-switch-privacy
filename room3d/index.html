<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>찹쌀떡 열람실</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F6EDDC; font-family: 'Jua', 'Noto Sans KR', sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cap { position: absolute; transform: translate(-50%, -100%); height: 22px; padding: 0 9px; line-height: 20px; font-size: 12px; color: #3A261E; background: #FFFDF9; border: 2px solid #3A261E; border-radius: 999px; white-space: nowrap; pointer-events: none; }
  .cap.me { background: #FFFDF9; } .cap.live { background: #FFE4E6; } .cap.ghost { opacity: .6; } .cap.phone { background: #E0F2FE; color: #1E3A5F; }
  #hud { position: absolute; left: 12px; right: 12px; top: 14px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  #hud .btn { pointer-events: auto; cursor: pointer; }
  .chip { height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #3A261E; background: #FFFDF9; border: 2px solid #3A261E; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  #hint { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); height: 24px; line-height: 22px; padding: 0 10px; font-size: 11px; color: #3A261E; background: rgba(255,253,249,.9); border: 1.5px solid #3A261E; border-radius: 999px; white-space: nowrap; pointer-events: none; }
  #pad { position: absolute; left: 22px; bottom: 108px; width: 108px; height: 108px; border-radius: 999px; background: rgba(255,253,249,.78); border: 2.5px solid #3A261E; box-sizing: border-box; touch-action: none; }
  #pad .ar { position: absolute; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #3A261E; opacity: .85; }
  #pad .u { left: 33px; top: 2px; } #pad .d { left: 33px; bottom: 2px; } #pad .l { left: 2px; top: 33px; } #pad .r { right: 2px; top: 33px; }
  #knob { position: absolute; left: 30px; top: 30px; width: 44px; height: 44px; border-radius: 999px; background: #F49D6E; border: 2px solid #3A261E; box-sizing: border-box; }
  #act { position: absolute; right: 22px; bottom: 118px; width: 156px; height: 56px; display: none; align-items: center; justify-content: center; text-align: center; font-size: 13.5px; line-height: 16px; color: #3A261E; background: #F49D6E; border: 3px solid #3A261E; border-radius: 16px; box-shadow: 0 4px 0 #3A261E; cursor: pointer; }
  #act.on { display: flex; flex-direction: column; gap: 1px; width: 188px; height: 52px; right: 22px; bottom: 118px; }
  #emo { position: absolute; right: 18px; bottom: 22px; width: 58px; height: 58px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: #F49D6E; border: 2.5px solid #3A261E; border-radius: 50%; box-shadow: 0 3px 0 #3A261E; cursor: pointer; }
  #emo svg { width: 26px; height: 26px; } #emo b { font-weight: normal; font-size: 11px; color: #3A261E; line-height: 11px; }
  #emo:active { transform: translateY(2px); box-shadow: 0 1px 0 #3A261E; }
  #emoPick { position: absolute; right: 18px; bottom: 92px; width: 216px; padding: 10px; display: none; grid-template-columns: 1fr 1fr; gap: 8px; background: #FFFDF9; border: 2.5px solid #3A261E; border-radius: 20px; box-shadow: 0 4px 0 #3A261E; animation: trayPop .18s ease-out; }
  .emoCell { height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #F7EFE1; border: 1.5px solid #D8CBBB; border-radius: 12px; cursor: pointer; font-size: 12px; color: #3A261E; text-align: center; }
  .emoCell:active { background: #F49D6E; } .emoCell i svg { width: 26px; height: 26px; display: block; }
  #bubbles { position: absolute; inset: 0; pointer-events: none; }
  .bubble { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 6px; padding: 7px 12px; background: #FFFDF9; border: 2.5px solid #3A261E; border-radius: 14px; font-size: 14px; color: #3A261E; white-space: nowrap; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px; background: #FFFDF9; border-right: 2.5px solid #3A261E; border-bottom: 2.5px solid #3A261E; transform: translateX(-50%) rotate(45deg); }
  .bubble i svg { width: 22px; height: 22px; display: block; }
  .bubble.pop { animation: pop .2s cubic-bezier(.3,1.6,.5,1); }
  .bubble .fx { position: absolute; left: 50%; top: -6px; font-style: normal; font-size: 15px; letter-spacing: 6px; color: #F49D6E; -webkit-text-stroke: .6px #3A261E; transform: translateX(-50%); animation: rise 1.2s ease-out forwards; }
  .bubble .fx-bow { color: #F8E5A6; } .bubble .fx-rest { color: #9CC5C9; } .bubble .fx-stomp { color: #F06A4F; font-size: 17px; }
  @keyframes pop { 0% { transform: translate(-50%, -100%) scale(.4); } 70% { transform: translate(-50%, -100%) scale(1.12); } 100% { transform: translate(-50%, -100%) scale(1); } }
  #emoPick { transform-origin: bottom right; }
  @keyframes trayPop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 6px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -26px); } }
  #act.off { background: #E8DFD1; color: #7A6A5E; }
  #act.mine { background: #9CC5C9; }
  .cap.res { background: #FEF3C7; }
  #act.lock { left: 50%; right: auto; transform: translateX(-50%); width: 240px; height: 50px; bottom: 96px; background: #F49D6E; }
  #act b { font-weight: normal; font-size: 15px; line-height: 17px; } #act small { font-size: 10.5px; line-height: 12px; opacity: .85; }
  #pin { display: none; position: absolute; transform: translate(-50%, -100%); height: 26px; line-height: 24px; padding: 0 12px; font-size: 12px; color: #3A261E; background: #F49D6E; border: 2px solid #3A261E; border-radius: 999px; white-space: nowrap; pointer-events: none; animation: bounce 1.1s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { margin-top: 0 } 50% { margin-top: -6px } }
  #fade { position: absolute; inset: 0; background: #F7EFE1; opacity: 0; pointer-events: none; transition: opacity .15s; }
  #fpv { position: absolute; inset: 0; background: url(assets/fpv_desk.png) center/cover; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #fpv .msg { position: absolute; left: 50%; top: 86px; transform: translateX(-50%); height: 26px; line-height: 24px; padding: 0 12px; font-size: 12px; color: #3A261E; background: #FFFDF9; border: 1.5px solid #3A261E; border-radius: 999px; white-space: nowrap; }
  #ring { display: none; }
  #pick { position: absolute; left: 0; right: 0; top: 58px; display: none; gap: 6px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
  #pick.on { display: flex; } #pick::-webkit-scrollbar { display: none; }
  #pick .chip { flex: none; height: 38px; box-sizing: border-box; cursor: pointer; background: #FFFDF9; }
  #cnt.open { background: #F49D6E; }
  /* 폭이 모자라면 가운데 열람실 이름만 줄임표로 줄인다 (인원·빈자리 수는 그대로) */
  #branch { flex-shrink: 1; min-width: 0; } #branch .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #pin { height: 34px; line-height: 30px; pointer-events: auto; cursor: pointer; box-sizing: border-box; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="caps"></div>
<div id="hud"><div class="chip btn" id="back">← 내 자리</div><div style="flex:1"></div><div class="chip" id="branch">🏛️ 찹쌀떡 열람실</div><div style="flex:1"></div><div class="chip btn" id="cnt">🪑 빈자리</div></div>
<div id="pick"></div>
<div id="hint">방향키로 걷기 · 쓸어 둘러보기 · 책상을 탭하면 길 안내</div>
<div id="pad"><div class="ar u">▲</div><div class="ar d">▼</div><div class="ar l">◀</div><div class="ar r">▶</div><div id="knob"></div></div>
<div id="act"></div>
<div id="emo"><svg viewBox="0 0 24 24"><path d="M4 5h16a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 16h-9l-4.5 3.5V16H4a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 4 5z" fill="#FFFDF9" stroke="#3A261E" stroke-width="1.8" stroke-linejoin="round"/><circle cx="9" cy="10" r="1" fill="#3A261E"/><circle cx="15" cy="10" r="1" fill="#3A261E"/><path d="M9.5 12.5c1.4 1.2 3.6 1.2 5 0" fill="none" stroke="#3A261E" stroke-width="1.6" stroke-linecap="round"/></svg><b>인사</b></div>
<div id="emoPick"></div>
<div id="bubbles"></div>
<div id="pin"></div>
<div id="fade"></div>
<div id="fpv"><div class="msg">🟢 입실 · 앱 잠그기</div></div>
<script>if (location.search.includes("rec=1")) document.title = "room3d-rec";</script>
<script type="importmap">{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js" } }</script>
<script type="module" src="room.js?v=20261109c"></script>
</body>
</html>
